name: britmart-supplier-platform

services:
  postgres:
    image: postgres:17-alpine
    container_name: britmart-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - britmart_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    networks:
      - britmart_network

  api:
    build:
      context: .
      dockerfile: Dockerfile
    image: britmart-supplier-api:1.0.0
    container_name: britmart-supplier-api
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      ENVIRONMENT: development
      DATABASE_ECHO: "false"
    command:
      - sh
      - -c
      - >
        python -m alembic upgrade head &&
        python -m uvicorn app.main:app
        --host 0.0.0.0
        --port 8000
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8000:8000"
    volumes:
      - ./data-generators/output:/app/data-generators/output:ro
    networks:
      - britmart_network

volumes:
  britmart_postgres_data:
    name: britmart_postgres_data

networks:
  britmart_network:
    name: britmart_network
    driver: bridge